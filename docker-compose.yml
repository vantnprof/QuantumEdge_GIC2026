services:
  data:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: python -m quantumedge.services.data_service
    environment:
      QE_ARTIFACTS_DIR: /app/artifacts
    volumes:
      - quantumedge-data:/app/artifacts/data

  pipeline:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: python -m quantumedge.pipelines.classical_baselines
    environment:
      QE_ARTIFACTS_DIR: /app/artifacts
    volumes:
      - quantumedge-data:/app/artifacts/data
      - quantumedge-results:/app/artifacts/results
    depends_on:
      data:
        condition: service_completed_successfully

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: uvicorn quantumedge.services.api:app --host 0.0.0.0 --port 8000
    environment:
      QE_ARTIFACTS_DIR: /app/artifacts
    ports:
      - "8000:8000"
    volumes:
      - quantumedge-data:/app/artifacts/data
      - quantumedge-results:/app/artifacts/results

  quantum-sim:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: >
      python -m quantumedge.pipelines.quantum_qrc
      --backend statevector
      --datasets mackey_glass lorenz
    environment:
      QE_ARTIFACTS_DIR: /app/artifacts
    volumes:
      - quantumedge-data:/app/artifacts/data
      - quantumedge-results:/app/artifacts/results
    profiles:
      - quantum

  quantum-aer:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: >
      python -m quantumedge.pipelines.quantum_qrc
      --backend aer
      --datasets mackey_glass
      --n-train 40
      --n-test 10
      --progress-every 10
    environment:
      QE_ARTIFACTS_DIR: /app/artifacts
    volumes:
      - quantumedge-data:/app/artifacts/data
      - quantumedge-results:/app/artifacts/results
    profiles:
      - quantum

  quantum-hardware:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: >
      python -m quantumedge.pipelines.quantum_qrc
      --backend ibm
      --datasets mackey_glass
      --n-train 40
      --n-test 10
      --progress-every 10
    environment:
      QE_ARTIFACTS_DIR: /app/artifacts
      QE_IBM_TOKEN: ${QE_IBM_TOKEN:-}
      QE_IBM_INSTANCE: ${QE_IBM_INSTANCE:-}
    volumes:
      - quantumedge-data:/app/artifacts/data
      - quantumedge-results:/app/artifacts/results
    profiles:
      - quantum-hardware

volumes:
  quantumedge-data:
  quantumedge-results:
