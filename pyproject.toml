[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantumedge-gic2026"
version = "0.1.0"
description = "QuantumEdge GIC 2026 volatility forecasting research pipeline."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "matplotlib>=3.7",
  "seaborn>=0.12",
  "yfinance>=0.2.0",
  "arch>=6.0",
  "reservoirpy>=0.4",
  "xgboost>=2.0",
  "torch>=2.0",
  "hmmlearn>=0.3",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
]
quantum = [
  "pennylane>=0.40",
  "pennylane-lightning>=0.40",
  "pennylane-qiskit>=0.40",
  "qiskit-aer>=0.15",
  "qiskit-ibm-runtime>=0.31",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
quantumedge-data = "quantumedge.services.data_service:main"
quantumedge-baseline = "quantumedge.pipelines.classical_baselines:main"
quantumedge-qrc = "quantumedge.pipelines.quantum_qrc:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
